meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  # --proxy-headers: настоящий IP клиента берётся из X-Forwarded-For (нужно для ограничений по IP)
  command: uvicorn server.main:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips '*'
  persistenceMount: /data
  containerPort: 80
